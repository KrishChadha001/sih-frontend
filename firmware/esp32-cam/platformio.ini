; Smart IV Drip System - ESP32-CAM firmware
; Board: AI-Thinker ESP32-CAM (ESP32-D0WDQ6, OV5640 5MP camera, 4MB PSRAM)
; https://docs.platformio.org/page/projectconf.html
;
; No onboard USB - flash via an external FTDI/USB-TTL adapter:
;   FTDI 5V  -> board 5V
;   FTDI GND -> board GND
;   FTDI TX  -> board U0R
;   FTDI RX  -> board U0T
; Tie GPIO0 to GND before powering on to enter flashing mode; remove that
; jumper and press reset to run normally afterwards.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; PSRAM is required - the OV5640 needs it for frame buffers at anything
; above the smallest resolutions, and camera init fails without it.
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
